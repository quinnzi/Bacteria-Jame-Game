<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FEED THE PIT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jersey+15&family=Libertinus+Keyboard&family=Rubik:ital,wght@0,300..900;1,300..900&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="gamestyle.css">

</head>
<body>
        <section id="gameStart">
        <h1>Go Bact Home</h1>
        <button id="start">Get to Dinner</button>
    </section>
        <section id="dead">
        <h1>Game Over!</h1>
        <p>You shrunk to the size of an atom and got plowed over by O2 molecules :D</p>
        <button id="try">Try Again</button>
    </section>
    <p id="int" style="user-select: none;"></p>
    <div id="dia">
        <h1 id="char" style="user-select: none;"></h1>
        <div>
            <p id="log" style="user-select: none;"></p>
        </div>
    </div>
    <canvas id="canvas1">
        
<img src="witch-spritesheet-flipped.png" id="witch">
<img src="witch-spritesheet.png" id="witchF">
<img src="Bacteria.png" id="bac">
<img src="floor.png" id="floor">
<img src="enemies (1).png" id="e">
<img src="mfff.png" id="forest">
    </canvas>
</body>
<script>
    const start = document.getElementById("start")
    start.addEventListener('click', ()=>{
        document.getElementById("gameStart").style.display = 'none'
          document.getElementById("canvas1").style.display = 'block'
    })


</script>
<script src="game.mjs" type="module"></script>
</html>
